<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#070a11" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea79" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark celestial base with soft gold rim -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Outer Armillary Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Equator Line -->
  <line x1="9" y1="32" x2="55" y2="32" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />

  <!-- Prime Meridian Ellipse -->
  <ellipse cx="32" cy="32" rx="11" ry="23" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85" />

  <!-- Cross-meridian / Astrolabe tilt arc -->
  <ellipse cx="32" cy="32" rx="23" ry="8" fill="none" stroke="url(#arcGrad)" stroke-width="1.8" stroke-dasharray="2 1.5" opacity="0.7" transform="rotate(-25 32 32)" />

  <!-- Central Pole Axis -->
  <line x1="32" y1="7" x2="32" y2="57" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

  <!-- Radiant North and South Axis Nodes -->
  <circle cx="32" cy="9" r="2" fill="#ffd700" />
  <circle cx="32" cy="55" r="2" fill="#ffd700" />

  <!-- Mythic Celestial Star / Astrolabe Center Core -->
  <circle cx="32" cy="32" r="4.5" fill="#ffd700" filter="url(#glow)" />
  <polygon points="32,23 34,30 41,32 34,34 32,41 30,34 23,32 30,30" fill="#ffffff" opacity="0.95" />
</svg>
